#  ███    ██     ███████     ██   ██      ██████      ██
#  ████   ██     ██          ██  ██      ██    ██     ██
#  ██ ██  ██     █████       █████       ██    ██     ██
#  ██  ██ ██     ██          ██  ██      ██    ██
#  ██   ████     ███████     ██   ██      ██████      ██
# ******************************************************************************************************************************
#                     惩罚配置
# ******************************************************************************************************************************
# 这里定义各检测达到一定 VL 后要执行什么。
# Neko 会先匹配 checks，再根据 commands 里的阈值决定是否告警、保存、拉回或执行命令。
#
# 可用变量：
# %check_name% - 检查名称
# %vl% - 当前违规值
# %max_vl% - 该检测展示用最大违规值
# %add% - 本次新增违规值
# %verbose% - 额外信息
# %player% - 玩家名
# %uuid% - 玩家 UUID
# %description% - 检查说明
# %cps% - 当前 CPS
# %last_cps% - 上一段 CPS
# %random_int% - 随机 1-10 整数
# %random_string% - 随机短字符串
# %anticheat% - 随机反作弊名字
# %anticheat_color% - 上面对应的主题色
# %world% - 玩家所在世界
# %mix_ping% - 混合延迟，通常为 transaction ping / keepalive ping
# %transaction_ping% - transaction ping
# %keepalive_ping% - keepalive ping
# %fast_math% - 目标是否疑似关闭原版数学行为
# %special_random_string% - 基于检测名生成的加密随机串
# %neko_placeholder_ban% - 读取 function.placeholder.ban 中的整段命令模板
# %neko_placeholder_kick% - 读取 function.placeholder.kick 中的整段命令模板
# %neko_placeholder_<key>% - 读取 function.placeholder.<key> 中自定义的命令模板（支持单条或列表）
#
# 内置动作：
# [alert] - 发告警
# [save] - 保存 VL 到数据库
# [setback] - 拉回玩家
# [shuffle] - 打乱玩家快捷栏
# [reset-use] - 重置玩家当前使用物品状态
# [close-inventory] - 强制关闭玩家当前背包界面
#
# checks 里的特殊前缀：
# $ = 精确匹配检查名，不再使用 startsWith 模糊匹配
# ! = 反向处理，把已经加进来的检查移除掉
# * = 通配前缀，通常写在结尾，表示匹配这一段前缀下的所有检查
#
# 例子：
# - "KillAura"       -> 匹配所有以 KillAura 开头的检查
# - "$KillAuraC"     -> 只匹配名为 KillAuraC 的检查
# - "!KillAuraB"     -> 把当前组里以 KillAuraB 开头的检查移除
# - "Aim*"           -> 匹配所有以 Aim 开头的检查
# - "!$AimY"         -> 只把 AimY 这个检查从当前组里移除
#
# commands 里的内置动作例子：
# - "5:1 [alert] &f%player% &5行为异常"
# - "5:1 [save]"
# - "10:0 [setback]"
# - "8:2 [shuffle]"
# - "6:2 [reset-use]"
# - "6:2 [close-inventory]"
#
# remove-violations-after: 这一组缓存的 VL 多久清掉一次，单位秒。
#
# commands 的格式：
# 前一个数字:后一个数字 命令
# 前一个数字 = 首次达到多少 VL 才执行
# 后一个数字 = 之后每多多少 VL 再执行一次
#
# 例子：
# 70:20 neko mitigate %player% rotate
# 含义：
# 玩家 VL 到 70 时执行一次，之后每再增加 20 VL 继续执行一次。
Punishments:

  #Movement
  MovementValidation:
    remove-violations-after: 150 #原40
    checks:
      - "MovementValidation"
    commands:
      - "20:10 [alert] &f%trust_player% &5Movement Incorrect"
      - "30:5 [save]"
      - "60:10 neko mitigate %player% damage"
      - "90:0 neko delay %random_int% kick %player% %anticheat% &7> %anticheat_color%Unfair Advantage &7[%special_random_string% m=%fast_math% S=%server%]"

