# ******************************************************************************************************************************
#                     惩罚配置
# ******************************************************************************************************************************
# %check_name% - 检查名称
# %vl% - 违规数
# %max_vl% - 检测的最大违规数
# %add% - 增加的违规数
# %verbose% - 额外信息
# %player% - 玩家名字
# %uuid% - 玩家uuid
# %description% - 检查介绍
# %cps% - 玩家每秒的点击数
# %last_cps% - 玩家上一刻的点击数
# %random_int% - 随机1-10的整数
# %random_string% - 随机短字符串
# %anticheat% - 随机反作弊名字
# %anticheat_color% - 对应前一个的随机反作弊的主题
# %world% - 对应玩家所在世界
# %mix_ping% - 显示玩家对应的混合延迟,就是真实延迟 / 正常延迟 打个比方: "30 / 100" 前者真实延迟 后者普通延迟
# %transaction_ping% - 显示玩家对应的真实延迟
# %keepalive_ping% - 显示玩家对应的延迟
# %fast_math% - 检测目标是否开启了FastMath (这个东西会影响Yuki的检测精度)
# %special_random_string% - 加密的 随机内容 + 检测名字
# [alert] - 警告的特殊命令
# [save] - 保存vl至数据库
# [setback] - 拉回玩家
#
# 一些介绍
#
# `remove-violations-after`：表示清理所有 VL (违例) 的时间，单位为秒。
#
# 命令执行中的格式：
# 数字:数字
# 前者数字表示达到该 VL 后执行指定命令，
# 后者数字表示在该 VL 后每重复多少个 VL 执行一次该命令。
#
# 举例:
# 70:20 yuki mitigate %player% rotate
# 解释：
# 当玩家的 VL 达到 70 时，执行命令 `yuki mitigate %player% rotate`。
# 然后每当玩家的 VL 增加 20 时，再次执行该命令。
Punishments:

  #Movement
  MovementValidation:
    remove-violations-after: 40 #原300
    checks:
      - "MovementValidation"
    commands:
      - "20:10 [alert]"
      - "50:20 yuki mitigate %player% rotate"
      - "60:10 yuki mitigate %player% damage"
      - "70:5 [save]"
      - "90:0 yuki delay %random_int% ban %player% 1h %anticheat% &7> %anticheat_color%Unfair Advantage &7[%random_string%-%special_random_string% m= %fast_math% S=%server%]"

