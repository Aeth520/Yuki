##############################################
# 数据配置
# 每个配置项上方均注明详细默认值信息。
##############################################
database-manager:
  # 数据类型：指定使用的数据库类型。可选值有 sqlite, mysql, mariadb, h2, mongodb.
  # 默认值: sqlite
  data-type: sqlite

  # 服务器名称：为数据库服务器命名，用于标识和日志记录。
  # 默认值: "ServerName"
  server-name: "ServerName"

  # ---------------------------
  # MySQL 配置
  # 配置 MySQL 数据库的连接参数。
  mysql:
    # 数据库主机：MySQL 服务所在的主机地址。
    host: "localhost"
    # 数据库端口：MySQL 服务的监听端口号。
    port: 3306
    # 数据库名称：要连接的 MySQL 数据库名称。
    database: "your_database"
    # 用户名：用于连接 MySQL 的用户名。
    username: "your_username"
    # 密码：连接 MySQL 的密码。
    password: "your_password"
    # SSL模块: 用于开启数据库的SSL模式
    ssl: false

  # ---------------------------
  # MongoDB 配置
  # 配置 MongoDB 数据库的连接参数。
  mongodb:
    # 数据库主机：MongoDB 服务所在的主机地址。
    host: localhost
    # 数据库端口：MongoDB 服务的监听端口号。
    port: 27017
    # 数据库名称：要连接的 MongoDB 数据库名称。
    database: your_database_name
    # 用户名：用于连接 MongoDB 的用户名。
    username: your_username
    # 密码：用于连接 MongoDB 的密码。
    password: your_password
    # 认证数据库：用于用户认证的 MongoDB 数据库名称。
    authentication-database: admin
