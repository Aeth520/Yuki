name: Yuki
version: ${version}
main: cn.aetheris.yuki.Yuki
load: POSTWORLD
description: "An AntiCheat Plugin | Powered By Aetheris"
api-version: 1.13
authors: [ Aetheris ]
commands:
  yuki:
    aliases: [ "yk" ]
    description: "主命令"
    permission: "yuki.commands"

permissions:
  yuki.staff:
    children:
      yuki.brand: true
      yuki.exempt.cancel: true
      yuki.exempt.highpingkick: true
      yuki.exempt.setback: true
      yuki.commands: true
      yuki.commands.alert: true
      yuki.commands.freeze: true
      yuki.commands.unfreeze: true
      yuki.commands.decrypt: true
      yuki.commands.alerts.enable-on-join: true
      yuki.commands.spectate: true
      yuki.commands.mitigate: true
      yuki.commands.setback: true
      yuki.commands.stopspectating: true
      yuki.commands.crash: true
      yuki.commands.dump: true
      yuki.commands.develop: true
      yuki.commands.reload: true
      yuki.commands.discordtest: true
      yuki.commands.send-alert: true
      yuki.commands.control: true
      yuki.commands.controlcheck: true
      yuki.commands.history: true
      yuki.commands.history.clear: true
      yuki.commands.delay: true
      yuki.commands.punish: true
      yuki.commands.features: true
      yuki.commands.perf: true
      yuki.commands.log: true
      yuki.commands.info: true

  yuki.commands:
    default: op

  yuki.commands.alerts.enable-on-join:
    description: Enable alerts on join
    default: op

  yuki.commands.crash:
    description: Crash a player's client
    default: op

  yuki.commands.dump:
    description: Export diagnostic dump
    default: op

  yuki.commands.develop:
    description: Toggle developer mode
    default: op

  yuki.commands.reload:
    description: Reload plugin config
    default: op

  yuki.commands.discordtest:
    description: Test Discord webhook
    default: op

  yuki.commands.send-alert:
    description: Send a broadcast alert
    default: op

  yuki.commands.control:
    description: Control player
    default: op

  yuki.commands.controlcheck:
    description: Control check status
    default: op

  yuki.commands.history:
    description: View violation history
    default: op

  yuki.commands.history.clear:
    description: Clear all violation history
    default: op

  yuki.commands.delay:
    description: Delay a command
    default: op

  yuki.commands.punish:
    description: Punish a player
    default: op

  yuki.commands.features:
    description: Toggle features
    default: op

  yuki.commands.perf:
    description: Performance monitor
    default: op

  yuki.commands.log:
    description: Upload logs
    default: op

  yuki.commands.info:
    description: Show player info
    default: op

  yuki.brand:
    description: Show client brands on join
    default: op

  yuki.antiplugin:
    default: op

  yuki.exempt:
    description: Exempt from all checks
    default: op
    children:
      yuki.exempt.*: true

  yuki.exempt.cancel:
    description: Exempt cancel from anticheat
    default: op

  yuki.exempt.highpingkick:
    default: op

  yuki.exempt.modifypacket:
    description: Disable modifying packets
    default: "false"

  yuki.exempt.setback:
    description: Disable setback
    default: op

softdepend:
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - floodgate
  - PlaceholderAPI
  - MythicMobs
  - MyPet
