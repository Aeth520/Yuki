##############################################
# Punishment Configuration
# This file defines what Neko should do after checks reach certain VL ranges.
# The layout and detail are intentionally kept aligned with the Chinese edition.
##############################################
# %check_name% - Check display name
# %vl% - Current violations
# %max_vl% - Display max violations for the check
# %add% - Violations added by the current flag
# %verbose% - Extra detail text
# %player% - Player name
# %uuid% - Player UUID
# %description% - Check description
# %cps% - Current CPS
# %last_cps% - Previous CPS sample
# %random_int% - Random integer from 1 to 10
# %random_string% - Random short string
# %anticheat% - Random anti-cheat branding name
# %anticheat_color% - Color code matching the random anti-cheat name
# %world% - Player world name
# %mix_ping% - Mixed ping display, usually transaction ping / keepalive ping
# %transaction_ping% - Transaction ping used by the anti-cheat timing pipeline
# %keepalive_ping% - Regular keepalive ping
# %fast_math% - Whether the target appears to use non-vanilla math behaviour
# %special_random_string% - Encrypted random content tied to the check name
# %neko_placeholder_ban% - Internal variable loaded from function.placeholder.ban
# %neko_placeholder_kick% - Internal variable loaded from function.placeholder.kick
# %neko_placeholder_<key>% - Custom variable loaded from function.placeholder.<key> (string or list)
# [alert] - Special built-in alert action
# [save] - Saves VL to the database
# [setback] - Sets the player back
# [shuffle] - Shuffles the player's hotbar
# [reset-use] - Resets the player's current item-use state
# [close-inventory] - Forces the player's current inventory to close
#
# Special prefixes inside `checks`:
# $ = exact check-name match instead of prefix matching
# ! = inverse/remove match from the current group
# * = wildcard-style suffix, usually used at the end to match a whole prefix range
#
# Examples:
# - "KillAura"       -> matches all checks starting with KillAura
# - "$KillAuraC"     -> matches only the exact check named KillAuraC
# - "!KillAuraB"     -> removes checks starting with KillAuraB from the current group
# - "Aim*"           -> matches all checks starting with Aim
# - "!$AimY"         -> removes only the exact AimY check from the current group
#
# Built-in command examples:
# - "5:1 [alert] &f%player% &5Suspicious Behaviour"
# - "5:1 [save]"
# - "10:0 [setback]"
# - "8:2 [shuffle]"
# - "6:2 [reset-use]"
# - "6:2 [close-inventory]"
#
# Notes
#
# remove-violations-after: time in seconds before this group's stored VL is cleared.
#
# Command format:
# first_number:repeat_number command
# The first number is the VL required before the command can run.
# The second number is how many extra VL must be added before the command runs again.
#
# Example:
# 70:20 neko mitigate %player% rotate
# Meaning:
# Run `neko mitigate %player% rotate` when VL reaches 70,
# then run it again every 20 VL after that.

Punishments:

  MovementValidation:
    remove-violations-after: 150
    checks:
      - "MovementValidation"
    commands:
      - "20:10 [alert] &f%trust_player% &5Movement Incorrect"
      - "30:5 [save]"
      - "60:10 neko mitigate %player% damage"
      - "90:0 neko delay %random_int% kick %player% %anticheat% &7> %anticheat_color%Unfair Advantage &7[%special_random_string% m=%fast_math% S=%server%]"

