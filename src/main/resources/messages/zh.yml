# ******************************************************************************************************************************
#                     语言
# 本部分配置主要用于定义插件的提示、警告、错误、命令使用说明等文本消息。
##############################################
# 命令前缀
##############################################
# 定义所有插件消息及命令响应的前缀文本，用于统一风格。
anticheat-prefix: "&3Yuki &8» &f"

##############################################
# 错误与信息提示
##############################################
# 当命令或操作执行失败时显示相应的错误提示消息。
only-player: "&c✘ 只有玩家才能执行这个命令!"   # 仅允许玩家执行此命令
no-permission: "&c✘ 您的权限不足!"              # 执行该命令所需权限不足
unknown-command: "&c✘ 未知命令!"                # 输入的命令未被识别
not-found: "&c✘ 玩家 &f%player%&c 不存在"         # 指定玩家不存在
not-online: "&c✘ 玩家 &f%player%&c 不在线!"       # 指定玩家当前不在线
not-data-user: "&c✘ 玩家 &f%player%&c 因权限绕过不被记录或不存在!"     # 该玩家因权限绕过而不被记录或不存在
not-my-self: "&c✘ 您不能对自己使用此命令!"             # 不能对自身执行该命令
stop-chat: "&c✘ 别说了别说了，服务器娘要不行了..."
##############################################
# 消息输出格式
##############################################
output:
  ##############################################
  # 客户端品牌显示格式
  ##############################################
  # 用于展示玩家进入游戏时使用的客户端品牌及其来源渠道。
  client-brand:
    format: "&f✦ 玩家 &b%player% &f使用 &b%brand% &f进入游戏 &7(&b%channel%&7)"

  ##############################################
  # 警报提示格式
  ##############################################
  alerts:
    # 启用警报消息：当所有检测已启用时显示的文本消息。
    # 默认值: "&f生当作人杰 死亦为鬼雄                                                       &a&lAll CHECKS HAVE BEEN ENABLED"
    enable: "&f生当作人杰 死亦为鬼雄                                                       &a&lAll CHECKS HAVE BEEN ENABLED"
    # 关闭警报消息：用于指示监控已停止的提示文本。
    # 默认值: "&e结束监控..."
    disable: "&e结束监控..."
    # 警报标识符：用于在警报消息中显示一个警示符号。
    # 默认值: "&c⚠&f"
    expsymbol: "&c⚠&f"
    # 警报格式配置：定义不同场景下的警报消息模板。
    format:
      # 普通警报格式：用于常规检测失败时的警报消息模板。
      # 默认值: "&3⚠ &f%player% &7failed &3%check_name% &8» &f%exp% &7VL&8: &3%vl%"
      normal: "&3⚠ &f%player% &7failed &3%check_name% &8» &f%exp% &7VL&8: &3%vl%"
      # 代理警报格式：用于代理模式下的警报消息模板。
      # 默认值: "&3⚠ &f%player% &7failed &3%check_name% &8» &f%exp% &7VL&8: &3%vl%"
      proxy: "&3⚠ &f%player% &7failed &3%check_name% &8» &f%exp% &7VL&8: &3%vl%"

  ##############################################
  # 详细信息
  ##############################################
  verbose:
    # 启用详细信息：当开启详细模式时显示的提示文本。
    # 默认值: "&f人生自古谁无死 留取丹心照汗青                                                       &a&lVERBOSE HAVE BEEN ENABLED"
    enable: "&f人生自古谁无死 留取丹心照汗青                                                       &a&lVERBOSE HAVE BEEN ENABLED"
    # 关闭详细信息：用于停止显示详细信息的提示文本。
    # 默认值: "&a停止查看详细信息!"
    disable: "&a停止查看详细信息!"

  ##############################################
  # 鼠标悬停提示
  ##############################################
  # 配置鼠标悬停时显示的详细信息文本，支持多行显示。
  hover: |-
    &b✦ Ping: &f%mix_ping% &7(&fLag=&c%lagging%&7 | &c%move_lagging%&7)
    &b✦ TPS: &f%tps% | &bVer: &f%brand% %version%
    &7&m━━━━━━━━━━━━━━━━━━━━━━━━━━
    &b✦ 检查描述:
    &f%description%
    &7&m━━━━━━━━━━━━━━━━━━━━━━━━━━
    &b✦ 详细数据:
    &f%verbose%
    &7&m━━━━━━━━━━━━━━━━━━━━━━━━━━
    &b✦ &c点击击毙玩家 &f%player%

##############################################
# 踢出公告信息
##############################################
broadcast: |-
  &7&m--------------------------------------------------
  &c&l✗ &b&lKARHU CHEAT DETECTION
  &fKarhu &7has removed a player from the network due to cheating
  &7&m--------------------------------------------------
#  §7§m--------------------------------------------------
#  §c§l✗ §bLON&fANTICHEAT §bCHEAT DETECTION
#  %prefix%Has Removed §f%player%§7 For Cheating!
#  §7§m--------------------------------------------------
##############################################
# 踢出提示信息
##############################################
# 定义玩家因数据异常、超时或其他原因被踢出的提示信息文本。
kick:
  # 异常forge：玩家因forge版本异常被踢出的信息。
  invalid-forge: "&c✘ 客户端异常 &7(FORGE:github.com/MinecraftForge/MinecraftForge/issues/9309)"
  # 数据包异常提示：玩家因数据包异常被踢出的信息。
  packet: "%prefix%&c✘ 数据包异常"
  # 异常提示：内部异常错误信息，通常由网络异常引起。
  exception: "Internal Exception: io.netty.channel.unix.Errors$NativeIoException: readAddress(..) failed: Connection reset by peer (E)"
  # 超时提示：数据包传输超时时的错误信息。
  timed-out: "Internal Exception: io.netty.channel.unix.Errors$NativeIoException: readAddress(..) failed: Connection reset by peer (T)"
  # 默认异常提示：其他未分类的内部异常信息。
  default: "Internal Exception: io.netty.channel.unix.Errors$NativeIoException: readAddress(..) failed: Connection reset by peer (D)"
  # 不合法的客户端踢出提示：踢出在blacklist里的客户端品牌客户端
  invalid-client: "&c您的客户端异常 &7(%brand%)"
  # 不合法的延迟踢出：踢出在延迟高于一定值并持续了一段时间的玩家
  invalid-ping: "&c您的延迟异常的高,并且持续了 &f%duration% &7(%ping%)"
  # 维护踢出：服务器维护时显示的踢出消息。
  maintenance: "服务器维护中，请稍后重连"
  # 加载踢出：插件仍在加载时显示的踢出消息。
  loading: "服务器加载中，请稍候..."
##############################################
# 命令阻挡
##############################################
command-blocker:
  # 用于为玩家执行特殊命令时的阻止消息。
  message: "Unknown command. Type \"/help\" for help."

##############################################
# 命令处理配置
##############################################
# 以下部分配置各个命令的使用方法、提示消息及默认参数
commands:
  ##############################################
  # 观察命令
  ##############################################
  # 用于启动对指定玩家的观察模式。
  action: "yuki spectate %player%"

  ##############################################
  # 帮助命令
  ##############################################
  help:
    # 使用说明：展示命令帮助信息的使用方法。
    usage: "&3✦ 用法: &f/yuki help"
    # 帮助消息内容：包含所有可用命令及说明的多行文本。
    message: |-
      &7&m==============&b Yuki &7&m==============
      &3❖ &f/yuki alerts &8-&7 警报开关
      &3❖ &f/yuki version &8-&7 查看版本
      &3❖ &f/yuki log &7<页数> &8-&7 查看日志
      &3❖ &f/yuki verbose &8-&7 详细信息开关
      &3❖ &f/yuki spectate &7<玩家> &8-&7 观察玩家
      &3❖ &f/yuki stopspectating &8-&7 停止观察
      &3❖ &f/yuki debug &7<模式> <玩家> &8-&7 调试模式
      &3❖ &f/yuki reload &8-&7 重载配置
      &3❖ &f/yuki crash &7<玩家> <模式> &8-&7 崩溃客户端
      &3❖ &f/yuki setback &7<玩家> <模式> &8-&7 拉回玩家
      &3❖ &f/yuki delay &7<秒数> <命令> &8-&7 延迟执行
      &3❖ &f/yuki mitigate &7<玩家> <模式> &8-&7 处罚玩家
      &3❖ &f/yuki develop &8-&7 直接开启/关闭开发模式
      &3❖ &f/yuki control &7<玩家> &8-&7 直接开启/关闭目标玩家的检测
      &3❖ &f/yuki controlcheck &7<检测名> &8-&7 直接开启/关闭目标检测
      &3❖ &f/yuki hist&f/history &7<玩家> <页数> &8-&7 历史记录
      &3❖ &f/yuki punish &7<玩家> &8-&7 处罚该玩家
      &7&m==============&b Yuki &7&m==============

  ##############################################
  # 玩家档案命令
  ##############################################
  profile:
    # 使用说明：用于查看玩家档案信息的命令格式。
    usage: "&b✦ 用法: &f/yuki profile <玩家>"
    # 档案消息：展示玩家延迟、点击、传送、客户端版本、灵敏度等详细信息。
    message: |-
      &7&m━━━━━━━&b %player% 档案 &7&m━━━━━━━
      &b✦ 延迟: &f%mix_ping% &7(&c%lagging%&7 | &c%move_lagging%&7)
      &b✦ 点击: &f%cps%/%last_cps% | &b传送: &f%teleporting%
      &b✦ 乘骑: &f%riding% | &b版本: &f%version%
      &b✦ 客户端: &f%brand%
      &b✦ 灵敏度: &f水平 %h_sensitivity%% | 垂直 %v_sensitivity%%
      &b✦ 综合灵敏度: &f%wrapper_sensitivity%
      &b✦ 快速运算: &f%fast_math%
      &7&m━━━━━━━&b %player% 档案 &7&m━━━━━━━

  ##############################################
  # 重载命令
  ##############################################
  reload:
    # 重载失败提示：当配置重载失败时显示的错误信息。
    fail: "&c✘ 重载失败! &7(%reason%)"
    # 重载成功提示：配置重载成功后的提示信息。
    success: "&a✔ 配置重载完成"

  ##############################################
  # 延迟命令
  ##############################################
  delay:
    # 使用说明：定义延迟执行命令的格式，需指定延迟秒数和要执行的命令。
    usage: "&b✦ 用法: &f/yuki delay <秒数> <命令>"
    # 无效数字提示：当输入非整数时的错误提示信息。
    invalid: "&c✘ 请输入整数!"
    # 命令延迟提示：提示用户指定的命令将在延迟后执行。
    message: "&a✦ 命令 &b%command% &a将在 &e%delay%s &a后执行"

  ##############################################
  # 拉回命令
  ##############################################
  setback:
    # 使用说明：用于将玩家拉回至某一位置的命令格式。
    usage: "&b✦ 用法: &f/yuki setback <玩家>"
    # 拉回成功提示：显示成功拉回玩家后的信息，包含所用模式。
    message: "&a✦ 已使用 &b%mode% &a模式拉回 &e%player%"
    # 玩家免疫提示：当目标玩家无法被拉回时的提示信息。
    cannot: "&c✘ &f%player% &c对拉回免疫!"
    # 无效拉回模式提示：输入的拉回模式不存在时的错误提示。
    no-type: "&c✘ 无效的拉回模式!"
    # 默认拉回模式：当未指定模式时采用的默认模式。
    default-type: "normal"

  ##############################################
  # 版本命令
  ##############################################
  info:
    # 使用说明：查看插件版本信息的命令格式。
    usage: "&b✦ 用法: &f/yuki info"
    # 版本信息消息：显示插件版本、服务器信息、数据包事件统计等详细信息。
    message: |-
      &7&m━━━━━━━━&b Yuki &7&m━━━━━━━━
      &b✦ 版本: &f%version%
      &b✦ 服务器名: &f%server%
      &b✦ 服务器版本: &f%server_version%
      &b✦ 是否是Folia: &f%folia%
      &b✦ 是否支持高级API: &f%support_adventure%
      &b✦ 是否使用via &f%via%
      &b✦ 内存使用: &f%memory%
      &b✦ 服务器系统: &f%system%
      &b✦ 使用JAVA版本: &f%java%
      &b✦ 数据包事件版本: &f%packetevents%
      &7&m━━━━━━━━&b Yuki &7&m━━━━━━━━

  ##############################################
  # 警报发送命令
  ##############################################
  # 用于手动发送警报消息的命令格式。
  send-alert:
    usage: "&b✦ 用法: &f/yuki sendalert <模式> <消息>"
    # 默认的类型: 默认使用的模式
    # raw 是不带前缀
    # normal是带前缀
    default-type: "normal"

  ##############################################
  # 历史记录命令
  ##############################################
  history:
    # 使用说明：用于查看玩家过往检测记录的命令格式。
    usage: "&b✦ 用法: &f/yuki history <玩家> <页数>"
    # 分页数量：指定历史记录分页显示时每页显示的条目数。
    pages: 8
    # 分页头部显示格式：用于展示分页信息的标题行。
    header: "&b✦ 玩家 &e%player% &7(&f%page%&8/&f%maxPages%&7)"
    # 单条历史记录格式：定义每条记录显示时的文本格式。
    entry: "&8❖ &bID: &f%player% | &b类型: %check_name% %exp% | &bVL: &f%vl% | &b时间: &f%timeago%"
    # 删除全部历史记录提示：删除所有玩家历史数据时的提示信息。
    clean-all: "&a✔ 已清除所有玩家数据!"
    # 删除指定玩家历史记录提示：删除某玩家数据时显示的提示信息。
    clean: "&a✔ 已清除 &e%player% &a的数据!"

  ##############################################
  # 调试命令
  ##############################################
  debug:
    # 使用说明：用于开启或关闭预测调试模式的命令格式。
    usage: "&b✦ 用法: &f/yuki debug <类型> <玩家>"
    # 启用调试提示：当开启预测调试模式时显示的提示信息。
    enable: "&a✦ &b%type% &f调试模式 &a已开启"
    # 禁用调试：当开发模式关闭时则不生效
    no-develop: "&c✘ 请先开启 &bDevelop &c模式!"
    # 关闭调试提示：当关闭预测调试模式时显示的提示信息。
    disable: "&c✦ &b%type% &f调试模式 &c已关闭"

  ##############################################
  # 控制台调试命令
  ##############################################
  console-debug:
    # 使用说明：用于在控制台开启或关闭调试模式的命令格式，必须在控制台执行。
    usage: "&b✦ 用法: &f/yuki consoledebug <类型> <玩家>"
    # 控制台专用提示：若在非控制台环境中执行，则提示该命令仅限控制台使用。
    only-console: "&c✘ 仅限控制台使用!"
    # 启用控制台调试提示：在控制台为指定玩家启用指定类型调试时的提示信息。
    enable: "&a✦ 已为 &e%player% &a开启 &b%type% &f调试"
    # 关闭控制台调试提示：在控制台为指定玩家关闭指定类型调试时的提示信息。
    disable: "&c✦ 已为 &e%player% &c关闭 &b%type% &f调试"

  ##############################################
  # 预测日志命令
  ##############################################
  prediciton-logs:
    # 使用说明：用于查看指定日志ID的预测日志的命令格式。
    usage: "&b✦ 用法: &f/yuki logs <ID>"
    # 无效日志ID提示：输入的日志ID无效时显示的错误信息。
    invalid: "&c✘ 无效数值"
    # 未找到日志提示：当指定日志ID不存在时的提示信息。
    not-found: "&c✘ 找不到日志 ID: &e%flagId%"
    # 日志上传中提示：提示用户日志正在上传中。
    uploading: "&a✦ 上传中..."
    # 日志上传完成提示：上传完成后显示上传的URL地址。
    uploadded: "&a✔ 上传完成 &7URL: &f%url%"
    # 日志上传失败提示：上传日志失败时显示的错误信息。
    uploadfail: "&c✘ 上传失败!"
    # 日志上传失败（含核心信息）：当上传失败时附带核心信息的提示。
    uploadfail2: "&c✘ 上传失败 &7(&f%core%&7)"

  ##############################################
  # 观察命令
  ##############################################
  spectate:
    # 使用说明：启动观察指定玩家的命令格式。
    usage: "&b✦ 用法: &f/yuki spectate <玩家>"
    # 返回提示：提供返回观察前位置的提示信息（多行文本）。
    return: "\n&e✦ 点击返回观察前位置\n"
    # 观察成功提示：显示开始观察指定玩家时的成功消息。
    message: "&a✦ 开始观察 &e%player%"
    # 停止观察提示：显示停止观察模式时的提示信息。
    stop: "&a✦ 观察模式已停止"
  ##############################################
  # 开启开放模式命令
  ##############################################
  develop:
    # 使用说明：用于快捷打开开发模式的命令格式。
    usage: "&b✦ 用法: &f/yuki develop"
    # 成功打开开发模式: 成功打开了开发模式的提示
    enable: "&a✦ 成功打开开发模式!"
    # 成功关闭开发模式: 成功关闭了开发模式的提示
    disable: "&a✦ 成功关闭开发模式!"

  ##############################################
  # 崩溃命令
  ##############################################
  crash:
    # 使用说明：用于向指定玩家发送崩溃数据包的命令格式。
    usage: "&b✦ 用法: &f/yuki crash <玩家> <模式>"
    # 无效崩溃模式提示：当指定的崩溃模式不存在时的错误提示信息。
    invalid-type: "&c✘ 无效崩溃模式!"
    # 默认崩溃模式：当未指定崩溃模式时采用的默认值。
    default-type: "explosion"
    # 崩溃成功提示：显示成功发送崩溃数据包给指定玩家时的消息。
    message: "&a✦ 已向 &e%player% &a发送崩溃数据包"

  ##############################################
  # 处罚命令
  ##############################################
  mitigate:
    # 使用说明：用于对指定玩家执行处罚操作的命令格式。
    usage: "&b✦ 用法: &f/yuki mitigate <玩家> <模式>"
    # 无效处罚类型提示：当指定处罚模式不存在时的错误信息。
    invalid-type: "&c✘ 无效处罚类型: &e%type%"
    # 默认处罚模式：当未指定处罚模式时采用的默认值。
    default-type: "damage"
    types:
      damage:
        # 当处罚模式为伤害减免时的提示信息。
        message: "&b✦ 已对 &e%player% &b启用伤害减免"
      reset-item:
        # 当处罚模式为重置物品使用状态时的提示信息。
        message: "&b✦ 已重置 &e%player% &b物品状态"
      knock-back:
        # 当处罚模式为击退时的提示信息。
        message: "&b✦ 已对 &e%player% &b执行击退"
      rotate:
        # 当处罚模式为随机旋转视角时的提示信息。
        message: "&b✦ 已随机化 &e%player% &b视角"
      shuffle:
        # 当处罚模式为随机切换主手物品栏时的提示信息。
        message: "&b✦ 已切换 &e%player% &b主手物品"
      food:
        # 当处罚模式为重置饱食度时的提示信息。
        message: "&b✦ 已重置 &e%player% &b饱食度"
      resync:
        # 当处罚模式为重新同步玩家姿势时的提示信息。
        message: "&b✦ 已同步 &e%player% &b姿势"
      killaura:
        # 当处罚模式为传送攻击者到目标玩家身后时的提示信息。
        message: "&b✦ 已传送 &e%player% &b至 &e%target% &b身后"
        # 当玩家尚未攻击其他玩家时的提示信息。
        not-target: "&c✘ &e%player% &c尚未攻击玩家"
        # 当玩家被传送回原点时的提示信息。
        pull-back: "&b✦ 已将 &e%player% &b传回原点"
        # 当目标玩家疑似使用 KillAura 时的提示信息。
        attacked: "&c✦ 目标疑似使用 &4KillAura&c!"
        # 玩家被传送到目标玩家身后的持续时间（单位：tick）。
        tick: 10

  ##############################################
  # 冻结命令
  ##############################################
  freeze:
    # 使用说明：用于冻结指定玩家，使其无法移动的命令格式。
    usage: "&b✦ 用法: &f/yuki freeze <玩家>"
    # 冻结成功提示：显示玩家被冻结后的提示信息。
    message: "&b✦ 已冻结玩家 &e%player%"
    # 玩家已冻结提示：如果目标玩家已经被冻结时显示的错误信息。
    already-frozen: "&c✘ &e%player% &c已被冻结!"
    # 被冻结后提示：当玩家自己被冻结时显示的提示信息，通常包含申诉方式等说明。
    target-side: "&c❖ 您已被冻结！请加客服申诉\n&c❖ 请勿移动或退出游戏！"

  ##############################################
  # 解除冻结命令
  ##############################################
  unfreeze:
    # 使用说明：用于解除指定玩家冻结状态的命令格式。
    usage: "&b✦ 用法: &f/yuki unfreeze <玩家>"
    # 解除冻结成功提示：显示解除冻结后成功的提示信息。
    message: "&a✦ 已解除 &e%player% &a冻结"
    # 未冻结提示：当尝试解除冻结但目标玩家未被冻结时显示的错误信息。
    not-freeze: "&c✘ &e%player% &c未被冻结"
    # 被解除冻结提示：当玩家被解除冻结后显示的提示信息。
    target-side: "&a✦ 您已被解冻！"

  ##############################################
  # 检测控制命令
  ##############################################
  control:
    # 使用说明：用于开启或关闭指定玩家检测的命令格式。
    usage: "&b✦ 用法: &f/yuki control <玩家>"
    # 开启检测提示：显示为指定玩家开启检测时的提示信息，重复执行则切换状态。
    enable: "&a✦ 已为 &e%player% &a开启检测 &7(再次执行关闭)"
    # 关闭检测提示：显示为指定玩家关闭检测时的提示信息，重复执行则切换状态。
    disable: "&c✦ 已为 &e%player% &c关闭检测 &7(再次执行开启)"

  ##############################################
  # 处罚玩家命令
  ##############################################
  punish:
    # 使用说明：用于处罚玩家的命令格式。
    usage: "&b✦ 用法: &f/yuki punish <玩家>"
    # 发送处罚命令: 向目标玩家发送处罚命令
    message: "&a✦ 已向 &e%player% &a发送处罚命令!"

  ##############################################
  # 解密命令
  ##############################################
  decrypt:
    # 使用说明：用于解密加密文本
    usage: "&b✦ 用法: &f/yuki decrypt <加密文>"
    # 发送最终解密消息: 向执行者展示解密后的结果
    message: "&a✦ 解密的内容是 %message% !"

  ##############################################
  # 检测开关控制命令
  ##############################################
  control-check:
    # 使用说明：用于开启或关闭指定玩家检测的命令格式。
    usage: "&b✦ 用法: &f/yuki controlcheck <检测名>"
    # 找不到该检测：找不到对应的检测
    not-found: "&c✦ 并没有找到该检测!"
    # 开启特定检测提示：开启对应检测
    enable: "&a✦ 已经 &c开启 &a了检测 &e%check_name%"
    # 关闭特定检测提示：关闭对应检测
    disable: "&c✦ 已经 关闭 &c了检测 &e%check_name%"
